name: build-workflow
on: [ push, workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: setup Node.job
        uses: actions/setup-node@v2
        with:
          node-version: 18
          cache: npm
      - name: Install Dependecies
        run: |
          echo "Installingv Dependencies....."
          npm ci
      - name: Lint Code
        run: |
          echo "Linting Code....."
          npm run lint
      - name: Run tests
        run: |
          echo "Running tests....."
          npmr test
      - name: Build Project
        run: |
          echo "Building project"
          npm run build
      - name: Deploy project
        run: |
          echo "Deploy project....."